<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食器配 注文ツール</title>
<!-- Shopify App Bridge（管理画面への埋め込みに必要） -->
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js" data-api-key="{{ api_key }}"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/theme/mermaid.min.css">
<script src="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/gridjs.umd.js"></script>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f5f7fa;color:#1a1a2e}
.layout{display:flex;min-height:100vh}
.sidebar{width:190px;background:#1a1a2e;padding:20px 0;flex-shrink:0}
.logo{color:#fff;font-size:14px;font-weight:700;padding:0 16px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px}
.logo small{display:block;font-size:10px;color:#aaa;font-weight:400;margin-top:2px}
nav a{display:flex;align-items:center;gap:8px;padding:11px 16px;color:#ccc;text-decoration:none;font-size:12px;transition:.15s}
nav a:hover,nav a.active{background:rgba(255,255,255,.09);color:#fff}
nav a.active{border-left:3px solid #68b5e8;padding-left:13px}
.main{flex:1;padding:22px;overflow-x:auto}
.page{display:none}.page.active{display:block}
.top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
h2{font-size:16px;font-weight:700}
.updated{font-size:11px;color:#888;margin-top:2px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{padding:7px 10px;border:1px solid #d0d5dd;border-radius:7px;font-size:12px;background:#fff;cursor:pointer}
.btn{padding:8px 15px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.blue{background:#2F5496;color:#fff}.blue:hover{background:#1e3a6e}
.rust{background:#b7410e;color:#fff}.rust:hover{background:#8b3009}
.green{background:#2d6a4f;color:#fff}.green:hover{background:#1b4332}
.disabled{opacity:.45;pointer-events:none;cursor:not-allowed}
.status{font-size:12px;color:#555;padding:4px 0;min-height:20px}
.status.loading{color:#2F5496}.status.error{color:#c0392b}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px;overflow-x:auto;margin-top:4px}
.note{font-size:11px;color:#888;margin-top:10px;padding:8px 10px;background:#fffbf0;border-radius:6px;border-left:3px solid #f6ad55}
.filter-box{background:#fff;border-radius:8px;border:1px solid #e2e8f0;padding:12px 14px;margin-bottom:10px}
.filter-box .filter-title{font-size:12px;font-weight:600;color:#555;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.filter-items{display:flex;flex-wrap:wrap;gap:6px}
.filter-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1px solid #d0d5dd;background:#f8fafc;font-size:11px;cursor:pointer;user-select:none;transition:.15s}
.filter-chip input{width:12px;height:12px;cursor:pointer;accent-color:#b7410e}
.filter-chip:has(input:checked){background:#fff0eb;border-color:#b7410e;color:#b7410e;font-weight:600}
.filter-summary{font-size:11px;color:#b7410e;font-weight:600}
.gridjs-th{background:#2F5496!important;color:#fff!important;font-size:11px!important}
.gridjs-td{font-size:11px!important;vertical-align:middle!important}
.gridjs-tr:nth-child(even) .gridjs-td{background:#EBF1F8!important}
#page-cp .gridjs-th{background:#b7410e!important}
#page-cp .gridjs-tr:nth-child(even) .gridjs-td{background:#FFF5EE!important}
</style>
</head>
<body>
<div class="layout">
<div class="sidebar">
<div class="logo">食器配 注文ツール<small>Shopify連携</small></div>
<nav>
<a href="#" class="active" onclick="return showPage('orders',this)">🧵 未発送 注文データ</a>
<a href="#" onclick="return showPage('cp',this)">📮 クリックポスト</a>
</nav>
</div>

<div class="main">

<!-- 未発送注文データ -->
<div id="page-orders" class="page active">
<div class="top">
<div>
<h2>未発送 注文データ</h2>
<div class="updated" id="orders-updated">未取得</div>
</div>
<div class="controls">
<select id="orders-count"><option value="50">50件</option><option value="100">100件</option><option value="250">250件</option></select>
<button class="btn blue" id="orders-fetch" onclick="loadOrders()">📥 データ取得</button>
<a class="btn green disabled" id="orders-dl" href="#">⬇️ CSV保存</a>
</div>
</div>
<div id="orders-status" class="status">「データ取得」を押してください</div>
<div class="card" id="orders-card" style="display:none"><div id="orders-grid"></div></div>
</div>

<!-- クリックポスト -->
<div id="page-cp" class="page">
<div class="top">
<div>
<h2>クリックポスト 発送データ</h2>
<div class="updated" id="cp-updated">未取得</div>
</div>
<div class="controls">
<select id="cp-count"><option value="50">50件</option><option value="100">100件</option><option value="250">250件</option></select>
<button class="btn rust" id="cp-fetch" onclick="loadCP()">📥 データ取得</button>
<a class="btn green disabled" id="cp-dl" href="#">⬇️ CSV保存</a>
</div>
</div>
<div id="cp-status" class="status">「データ取得」を押してください</div>
<div id="cp-filter" class="filter-box" style="display:none">
<div class="filter-title">
<span>🔍 商品で絞り込み</span>
<span class="filter-summary" id="cp-filter-summary"></span>
</div>
<div class="filter-items" id="cp-filter-items"></div>
</div>
<div class="card" id="cp-card" style="display:none">
<div id="cp-grid"></div>
<div class="note">⚠️ 重量欄は空欄です。クリックポスト管理画面でご確認の上アップロードしてください。</div>
</div>
</div>

</div>
</div>

<script>
const SHOP = "{{ shop }}";
const OPTS = ["トップス／ロンパース","ロゴカラー","サイズ","サイズ調整","胸囲","袖丈","着丈","発送方法","備考欄"];

function showPage(id, el) {
document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
document.querySelectorAll("nav a").forEach(a => a.classList.remove("active"));
document.getElementById("page-" + id).classList.add("active");
el.classList.add("active");
return false;
}

// --- 注文データ ---
async function loadOrders() {
const count = document.getElementById("orders-count").value;
const btn = document.getElementById("orders-fetch");
const st = document.getElementById("orders-status");
btn.disabled = true;
st.className = "status loading"; st.textContent = "📡 Shopifyからデータ取得中...";
try {
const res = await fetch(`/api/orders?shop=${SHOP}&count=${count}`);
if (!res.ok) throw new Error(await res.text());
const { rows, extra_keys } = await res.json();
const cols = ["注文番号","注文日","商品（数量）", ...OPTS, ...extra_keys];
renderGrid("orders-grid", "orders-card", cols, rows.map(r =>
cols.map(c => c==="注文番号"?r.order : c==="注文日"?r.date : c==="商品（数量）"?r.title : (r.attrs[c]||""))
));
const dl = document.getElementById("orders-dl");
dl.href = `/download/orders?shop=${SHOP}&count=${count}`;
dl.classList.remove("disabled");
document.getElementById("orders-updated").textContent = "最終取得: " + new Date().toLocaleString("ja-JP");
st.className = "status"; st.textContent = `✅ ${rows.length}件を取得`;
} catch(e) { st.className = "status error"; st.textContent = "エラー: " + e.message; }
btn.disabled = false;
}

// --- クリックポスト ---
let cpAllRows = [];
let cpCount = "50";

async function loadCP() {
cpCount = document.getElementById("cp-count").value;
const btn = document.getElementById("cp-fetch");
const st = document.getElementById("cp-status");
btn.disabled = true;
st.className = "status loading"; st.textContent = "📡 Shopifyからデータ取得中...";
try {
const res = await fetch(`/api/clickpost?shop=${SHOP}&count=${cpCount}`);
if (!res.ok) throw new Error(await res.text());
cpAllRows = await res.json();
buildCpFilter();
renderCp();
document.getElementById("cp-updated").textContent = "最終取得: " + new Date().toLocaleString("ja-JP");
st.className = "status"; st.textContent = `✅ ${cpAllRows.length}件を取得`;
} catch(e) { st.className = "status error"; st.textContent = "エラー: " + e.message; }
btn.disabled = false;
}

function extractProducts(items) {
// "商品名×数量／商品名×数量" → 商品名リスト
return items.split("／").map(s => s.replace(/×\d+$/, "").trim()).filter(Boolean);
}

function buildCpFilter() {
// ユニークな商品名を収集
const allProducts = new Set();
cpAllRows.forEach(r => extractProducts(r.items).forEach(p => allProducts.add(p)));

const container = document.getElementById("cp-filter-items");
container.innerHTML = "";
[...allProducts].sort().forEach(product => {
const id = "cp-filter-" + btoa(unescape(encodeURIComponent(product))).slice(0,8);
const label = document.createElement("label");
label.className = "filter-chip";
label.innerHTML = `<input type="checkbox" id="${id}" value="${product}" checked onchange="renderCp()"> ${product}`;
container.appendChild(label);
});

document.getElementById("cp-filter").style.display = allProducts.size > 0 ? "block" : "none";
}

function getSelectedProducts() {
return [...document.querySelectorAll("#cp-filter-items input:checked")].map(el => el.value);
}

function renderCp() {
const selected = getSelectedProducts();
const filtered = cpAllRows.filter(r => {
const products = extractProducts(r.items);
return selected.some(sel => products.includes(sel));
});

const cols = ["郵便番号","氏名","都道府県","市区町村","番地","建物名","電話番号","内容品"];
renderGrid("cp-grid", "cp-card", cols, filtered.map(r => [r.zip,r.name,r.pref,r.city,r.addr1,r.addr2,r.phone,r.items]));

// CSV保存リンク更新（絞り込み済みデータをダウンロード）
const dl = document.getElementById("cp-dl");
const selectedParam = encodeURIComponent(selected.join(","));
dl.href = `/download/clickpost?shop=${SHOP}&count=${cpCount}&products=${selectedParam}`;
dl.classList.remove("disabled");

const summary = document.getElementById("cp-filter-summary");
summary.textContent = filtered.length < cpAllRows.length ? `${filtered.length}/${cpAllRows.length}件` : "";
}

function renderGrid(gridId, cardId, cols, data) {
const card = document.getElementById(cardId);
card.style.display = "block";
document.getElementById(gridId).innerHTML = "";
new gridjs.Grid({ columns: cols, data, sort: true, search: true, pagination: { limit: 30 } })
.render(document.getElementById(gridId));
}
</script>
</body>
</html>
