services:
  - type: web
    name: shokki-order-tool
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorm app:app
    envVars:
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_SHOP
        sync: false
      - key: APP_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
